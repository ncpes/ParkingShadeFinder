name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find latest iCar ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(
            find . -maxdepth 1 -type f \
              \( -iname 'iCar*.zip' -o -iname 'ParkingShadeFinder*.zip' \) \
              -print
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "ERROR: 找不到 iCar 遮陽停車 ZIP"
            exit 1
          fi

          if [ "${#ZIP_FILES[@]}" -gt 1 ]; then
            echo "ERROR: 根目錄有多個 iCar ZIP，請只保留一個："
            printf ' - %s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          ZIP_FILE="${ZIP_FILES[0]}"

          echo "使用 ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Remove old project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ParkingShadeFinder

      - name: Extract latest project
        shell: bash
        run: |
          set -euo pipefail

          unzip -q "$ZIP_FILE" -x '.github/*'

          echo "Project extracted successfully."

          if [ ! -d "ParkingShadeFinder" ]; then
            echo "ERROR: ZIP 解壓後找不到 ParkingShadeFinder 專案資料夾"
            echo "目前根目錄內容："
            ls -la
            exit 1
          fi

          if [ ! -f "ParkingShadeFinder/app/build.gradle" ]; then
            echo "ERROR: 找不到 app/build.gradle"
            exit 1
          fi

          if [ ! -f "ParkingShadeFinder/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: 找不到 AndroidManifest.xml"
            exit 1
          fi

      - name: Verify app version and name
        shell: bash
        working-directory: ParkingShadeFinder
        run: |
          set -euo pipefail

          echo "===== 驗證 App 版本 ====="

          VERSION_NAME=$(grep -oE "versionName ['\"][^'\"]+['\"]" app/build.gradle | head -n 1 | sed -E "s/.*versionName ['\"]([^'\"]+)['\"].*/\1/")

          echo "Detected versionName: $VERSION_NAME"

          echo "===== 驗證 App 名稱 ====="
          grep -E 'android:label' app/src/main/AndroidManifest.xml

          if [ -z "$VERSION_NAME" ]; then
            echo "ERROR: 找不到 versionName"
            exit 1
          fi

          if ! grep -q 'android:label="iCar遮陽停車"' app/src/main/AndroidManifest.xml; then
            echo "ERROR: App 名稱不是 iCar遮陽停車"
            exit 1
          fi

          echo "===== 版本與 App 名稱驗證成功 ====="
          echo "App version: $VERSION_NAME"

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Clean and build APK
        working-directory: ParkingShadeFinder
        shell: bash
        run: |
          set -euo pipefail

          echo "===== 開始清理舊建置 ====="
          gradle clean --no-daemon

          echo "===== 開始建置 APK ====="
          gradle assembleDebug --no-daemon

          echo "===== APK 建置完成 ====="
          ls -lh app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iCar遮陽停車-${{ env.VERSION_NAME }}-debug
          path: ParkingShadeFinder/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
