name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          rm -rf project
          mkdir project
          unzip -q ParkingShadeFinder-upload-easy.zip -d project

      - name: Build APK
        working-directory: project/ParkingShadeFinder
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ParkingShadeFinder-debug-apk
          path: project/ParkingShadeFinder/app/build/outputs/apk/debug/*.apk
