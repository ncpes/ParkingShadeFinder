name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'ParkingShadeFinder*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "找不到 ParkingShadeFinder ZIP"
            exit 1
          fi
          echo "使用 ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ParkingShadeFinder
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ParkingShadeFinder-v0.3.0-debug
          path: ParkingShadeFinder/app/build/outputs/apk/debug/*.apk
